name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Validate and publish package
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Releases require an existing tag."
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF"
          tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD

      - name: Validate release version
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo '::error::Publication requires a pushed version tag.'
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          changelog_version=$(awk '/^## / { print $2; exit }' CHANGELOG.md)
          if [[ "$tag" != "v$version" || "$changelog_version" != "$version" ]]; then
            echo '::error::Tag, pubspec version, and first changelog version must match.'
            exit 1
          fi

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.15'
          install_args: flutter just

      - name: Validate package
        run: just precommit

      - name: Verify pub score
        run: |
          dart pub global activate pana
          pana_output=$(dart pub global run pana . --no-warning)
          printf '%s\n' "$pana_output"
          score=$(printf '%s\n' "$pana_output" | sed -nE 's/.*Points: ([0-9]+)\/[0-9]+.*/\1/p')
          if [[ ! "$score" =~ ^[0-9]+$ ]] || (( score < 110 )); then
            echo '::error::Minimum pana score of 110 was not met.'
            exit 1
          fi

      - name: Read pinned Dart SDK version
        id: dart_sdk
        run: |
          version=$(dart --version 2>&1 | sed -nE 's/^Dart SDK version: ([^ ]+).*/\1/p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Request short-lived credentials after validation, using the same Dart version.
      - name: Configure pub.dev OIDC credentials
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ steps.dart_sdk.outputs.version }}

      - name: Publish Flutter package
        run: flutter pub publish --force

  complete-issues:
    name: Complete issues after successful publication
    needs: [publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Apply semantic release transition
        uses: ziqq/actions/labeler@a991545704ba3fc43380d2b6024db3ca6935e4a7
        with:
          operation: release-completed
          github-token: ${{ github.token }}
          config-source: api
          allow-empty: 'true'
          allow-pattern-removal: 'true'
          max-targets: '100'

  notify:
    name: Notify release or deploy result
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "pub_dev_url": "https://pub.dev/packages/flutter_in_store_app_version_checker",
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
