name: Publish to pub.dev

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    uses: ziqq/flutter_ci_workflows/.github/workflows/publish_to_pub.yml@main
    with:
      PANA_TOTAL: '110'
    secrets:
      PUB_CREDENTIAL_JSON: ${{ secrets.PUB_CREDENTIAL_JSON }}
      PUB_OAUTH_ACCESS_TOKEN: ${{ secrets.PUB_OAUTH_ACCESS_TOKEN }}
      PUB_OAUTH_REFRESH_TOKEN: ${{ secrets.PUB_OAUTH_REFRESH_TOKEN }}

  notify:
    name: Notify publish result
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@6bc6fdad743d4054c9b0603bb75f6aefa5235be6
        with:
          providers: discord,telegram
          template-path: .github/notify/release.md.tmpl
          variables: |
            {
              "status": "${{ needs.publish.result }}"
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ secrets.DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ secrets.TELEGRAM_TARGETS }}
