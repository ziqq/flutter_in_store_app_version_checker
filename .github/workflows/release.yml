name: Create GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v1.2.3

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release ${{ github.ref_name }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Releases require an existing tag."
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF"
          tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD

      - name: Check if release exists
        id: check_release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --notes "Automated release for version $GITHUB_REF_NAME"
